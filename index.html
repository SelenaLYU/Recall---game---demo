<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Recall 游戏 Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* 页面自身不滚动：FIT 已按窗口等比缩放（小窗口曾出现整页滚动条） */
        overflow: hidden;
        /* 信箱区兜底底色：其上还有 #letterbox-art 场景背景层（main.ts 按场景同步） */
        background: #15251f;
      }
      /* 信箱区场景背景：当前场景的背景图 cover+压暗+模糊，竖屏手机上大片留边
         不再是纯色块，读作"场景的延伸"（main.ts 按场景切换，带 0.45s 淡入淡出） */
      #letterbox-art {
        position: fixed;
        inset: 0;
        z-index: 0;
        opacity: 0;
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        filter: blur(10px) brightness(0.55) saturate(0.9);
        transition: opacity 0.45s ease;
      }
      #letterbox-art::after {
        /* 压暗层：保证留边不与游戏画面争亮度 */
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(8, 17, 13, 0.38);
      }
      /* 游戏容器铺满视口：尺寸路径只走 CSS，不再由 JS 设高度 */
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        /* 画布区域在场景背景层之上 */
        z-index: 1;
      }
      /* 触摸屏：禁掉画布上的浏览器手势（滚动/双击缩放/长按菜单），输入全部交给游戏 */
      #game canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <div id="letterbox-art"></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
