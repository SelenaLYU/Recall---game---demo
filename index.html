<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall 游戏 Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* 页面自身不滚动：FIT 已按窗口等比缩放（小窗口曾出现整页滚动条） */
        overflow: hidden;
        /* 信箱区底色：由 main.ts 按场景同步（FIT 留边读作场景的延伸而不是黑框） */
        background: #15251f;
        transition: background-color 0.45s ease;
      }
      /* 游戏容器铺满视口：尺寸路径只走 CSS，不再由 JS 设高度 */
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
